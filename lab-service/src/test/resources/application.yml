# ===== 测试专用配置:覆盖主配置的 MySQL/Nacos,使用 H2 内存库 =====
DB_PASSWORD: test

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:service_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    nacos:
      discovery:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
