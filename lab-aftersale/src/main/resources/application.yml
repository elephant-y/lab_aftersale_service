spring:
  application:
    name: lab-aftersale
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/aftersale_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    # 口令通过环境变量注入,不入库;本地启动见 scripts/start-services.sh
    password: ${DB_PASSWORD}

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
        fail-fast: false

  mybatis:
    type-aliases-package: com.oomall.aftersale.mapper.po
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  logging:
    level:
      com.oomall.serviceorder.mapper: debug
server:
  port: 8082